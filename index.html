.top{top:12px}.bottom{bottom:12px}
.bar .t{font-weight:600;margin-right:6px}

.bt{font:inherit;font-size:13px;padding:7px 12px;min-height:36px;border:1px solid rgba(0,0,0,.15);border-radius:8px;background:#fff;color:#2C2C2A;cursor:pointer}
.bt.on{background:#185FA5;border-color:#185FA5;color:#fff}
.bt:focus-visible,.tb:focus-visible{outline:2px solid #185FA5;outline-offset:2px}
.hint{color:#5F5E5A;font-size:12px;margin-left:auto}
.hidden .bar{opacity:0;pointer-events:none}
.hidden .top{transform:translateY(-12px)}.hidden .bottom{transform:translateY(12px)}
.tools{position:fixed;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:6}
.tb{width:44px;height:44px;border-radius:10px;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.92);color:#2C2C2A;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.tb.on{background:#185FA5;color:#fff;border-color:#185FA5}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
